[project]
name = "version-c"
version = "0.1.0"
description = "FAL LoRA character swap eval and scoring"
requires-python = ">=3.10"
dependencies = [
    "diffusers>=0.32.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "accelerate>=0.30.0",
    "peft>=0.10.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "insightface>=0.7.3",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "onnxruntime-gpu>=1.18.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu128"]
index-strategy = "unsafe-best-match"
